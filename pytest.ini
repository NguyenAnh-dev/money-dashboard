[pytest]
# `pytest` from the project root, with no arguments, should do the right thing.
testpaths = tests

# tests/ has no __init__.py, so pytest's default "prepend" import mode puts
# tests/ on sys.path -- NOT the project root, which is where `core` and
# `adapters` live. Without this line every test file would need its own
# sys.path.insert preamble (which is exactly what check_baseline.py does, and
# has to keep doing: it is run as a script, so pytest.ini never applies to it).
pythonpath = .

# check_baseline.py is deliberately NOT collected: it is a standalone script
# with a `main()` returning an exit code, not a pytest module, and its name
# does not match python_files anyway. Run it separately -- see CLAUDE.md.
python_files = test_*.py
